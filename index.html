<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecoverde Homes &mdash; Unit Finder</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div id="map"></div>
      <div id="reroute-banner" class="reroute-banner hidden" role="status" aria-live="polite">
        Tap the road segment you want to avoid.
      </div>
      <form id="search-form" class="search" autocomplete="off">
        <select id="block-select" aria-label="Block">
          <option value="">Block</option>
        </select>
        <select id="lot-select" aria-label="Lot" disabled>
          <option value="">Lot</option>
        </select>
        <button type="submit" title="Find selected block or lot">
          <svg class="find-toggle-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/>
          </svg>
          <span class="find-toggle-label">Find</span>
        </button>
        <span class="search-separator" aria-hidden="true"></span>
        <div class="layers-menu">
          <button
            type="button"
            id="layers-toggle"
            aria-haspopup="true"
            aria-expanded="false"
            aria-label="Layer"
            title="Show or hide map layers"
          >
            <svg class="layers-toggle-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.005 11.19V12l6.998 4.042L19 12v-.81M5 16.15v.81L11.997 21l6.998-4.042v-.81M12.003 3 5.005 7.042l6.998 4.042L19 7.042 12.003 3Z"/>
            </svg>
            <span class="layers-toggle-label">Layer</span>
          </button>
          <div id="layers-panel" class="layers-panel hidden">
            <label>
              <input type="checkbox" id="layer-obstacle" />
              Obstacle
            </label>
            <label>
              <input type="checkbox" id="layer-administrative" />
              Administrative
            </label>
            <label>
              <input type="checkbox" id="layer-road-names" />
              Road names
            </label>
          </div>
        </div>
      </form>

      <aside id="route-panel" class="route-panel hidden" aria-live="polite">
        <div class="route-panel-section route-panel-head">
          <div id="route-unit" class="route-unit">Block -, Lot -</div>
          <div id="route-meta" class="route-meta">ETA from the gate · -- km</div>
        </div>
        <div id="route-eta-rows" class="route-panel-section route-eta-rows"></div>
        <div class="route-panel-section route-narrative-wrap">
          <div id="route-narrative" class="route-narrative"></div>
        </div>
        <div class="route-panel-section route-actions">
          <button type="button" id="route-clear" class="eta-clear" aria-label="Clear route" title="Clear route and selection">
            Clear route
          </button>
          <button type="button" id="route-reroute" class="eta-reroute" aria-label="Re-route" title="Pick a road point to avoid and recalculate route">
            Re-route
          </button>
          <button type="button" id="route-dismiss" class="eta-dismiss" aria-label="Dismiss" title="Close route panel">
            Dismiss
          </button>
        </div>
      </aside>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
