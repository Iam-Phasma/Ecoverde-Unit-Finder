<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecoverde Homes Rosario Unit Finder</title>
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="dns-prefetch" href="https://unpkg.com" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="css/style.css?v=20261003-2229" />
  </head>
  <body>
    <main>
      <div id="map"></div>
      <div
        id="reroute-banner"
        class="reroute-banner hidden"
        role="status"
        aria-live="polite"
      >
        Tap the road segment you want to avoid.
      </div>
      <form id="search-form" class="search" autocomplete="off">
        <select id="block-select" aria-label="Block">
          <option value="">Block</option>
        </select>
        <select id="lot-select" aria-label="Lot" disabled>
          <option value="">Lot</option>
        </select>
        <button type="submit" title="Find selected block or lot">
          <svg
            class="find-toggle-icon"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-width="2"
              d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
            />
          </svg>
          <span class="find-toggle-label">Find</span>
        </button>
        <div class="layers-menu">
          <button
            type="button"
            id="layers-toggle"
            aria-haspopup="true"
            aria-expanded="false"
            aria-label="Layers"
            title="Show or hide map layers"
          >
            <svg
              class="layers-toggle-icon"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5.005 11.19V12l6.998 4.042L19 12v-.81M5 16.15v.81L11.997 21l6.998-4.042v-.81M12.003 3 5.005 7.042l6.998 4.042L19 7.042 12.003 3Z"
              />
            </svg>
            <span class="layers-toggle-label">Layers</span>
          </button>
          <div id="layers-panel" class="layers-panel hidden">
            <label>
              <input type="checkbox" id="layer-amenities" checked />
              Amenities
            </label>
            <label>
              <input type="checkbox" id="layer-administrative" />
              Buildings
            </label>
            <label id="layer-decoration-option">
              <input type="checkbox" id="layer-decoration" checked />
              Decorations
            </label>
            <label>
              <input type="checkbox" id="layer-obstacle" />
              Obstacles
            </label>
            <label>
              <input type="checkbox" id="layer-road-names" checked />
              Street names
            </label>
          </div>
        </div>
      </form>
      <div
        id="lyket-button"
        class="lyket-button"
        aria-label="Like this map"
        data-tooltip="Thank's for liking"
        data-lyket-type="like"
        data-lyket-id="map-like"
        data-lyket-namespace="ecoverde-unit-finder"
        data-lyket-color-primary="#c23d56"
        data-lyket-color-background="transparent"
        data-lyket-color-icon="#6a5d4b"
        data-lyket-show-counter-from="999999"
      ></div>

      <aside id="route-panel" class="route-panel hidden" aria-live="polite">
        <div class="route-panel-section route-panel-head">
          <div id="route-unit" class="route-unit">Block -, Lot -</div>
          <div id="route-meta" class="route-meta">
            ETA from the gate · -- km
          </div>
        </div>
        <div
          id="route-eta-rows"
          class="route-panel-section route-eta-rows"
        ></div>
        <div class="route-panel-section route-narrative-wrap">
          <div id="route-narrative" class="route-narrative"></div>
          <button
            type="button"
            id="route-share"
            class="route-share"
            title="Copy a link to this route"
          >
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15.141 6 5.518 4.95a1.05 1.05 0 0 1 0 1.549l-5.612 5.088m-6.154-3.214v1.615a.95.95 0 0 0 1.525.845l5.108-4.251a1.1 1.1 0 0 0 0-1.646l-5.108-4.251a.95.95 0 0 0-1.525.846v1.7c-3.312 0-6 2.979-6 6.654v1.329a.7.7 0 0 0 1.344.353 5.174 5.174 0 0 1 4.652-3.191l.004-.003Z"/>
            </svg>
            <span>Share</span>
          </button>
        </div>
        <div class="route-panel-section route-actions">
          <button
            type="button"
            id="route-clear"
            class="eta-clear"
            aria-label="End route"
            title="End route and clear selection"
          >
            End Route
          </button>
          <button
            type="button"
            id="route-reroute"
            class="eta-reroute"
            aria-label="Re-route"
            title="Pick a road point to avoid and recalculate route"
          >
            Re-route
          </button>
          <button
            type="button"
            id="route-dismiss"
            class="eta-dismiss"
            aria-label="Hide Card"
            title="Hide route card"
          >
            Hide Card
          </button>
        </div>
      </aside>
      <div
        id="welcome"
        class="welcome hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="welcome-title"
      >
        <form id="welcome-form" class="welcome-card" autocomplete="off">
          <div class="welcome-brand">
            <img src="assets/eco-logo.svg" alt="" />
            <div>
              <h1 id="welcome-title">Ecoverde Homes</h1>
              <span class="welcome-location">ROSARIO</span>
            </div>
          </div>
          <p>
            Enter the block and lot number to locate a home and get directions.
          </p>
          <div class="welcome-fields">
            <label>
              <span>Block</span>
              <select id="welcome-block" aria-label="Block">
                <option value="">Block</option>
              </select>
            </label>
            <label>
              <span>Lot</span>
              <select id="welcome-lot" aria-label="Lot" disabled>
                <option value="">Lot</option>
              </select>
            </label>
          </div>
          <button type="submit" id="welcome-find" class="welcome-find" disabled>
            <span>Find</span>
            <svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="26"
              height="26"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                d="M4 12h15m-6-6 6 6-6 6"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
              />
            </svg>
          </button>
          <button type="button" id="welcome-skip" class="welcome-skip">
            Explore the map instead
          </button>
        </form>
      </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@lyket/widget@latest/dist/lyket.js?apiKey=pt_697795132193026632019e5e22420e"></script>
    <script type="module" src="js/main.js?v=20261003-2251"></script>
    <script data-goatcounter="https://terralyft.goatcounter.com/count"
        async src="//gc.zgo.at/count.js">
      </script>
  </body>
</html>
