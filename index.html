<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecoverde Homes &mdash; Unit Finder</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Ecoverde Homes <span>Unit Finder</span></h1>
      <form id="search-form" class="search" autocomplete="off">
        <select id="block-select" aria-label="Block">
          <option value="">Block</option>
        </select>
        <select id="lot-select" aria-label="Lot" disabled>
          <option value="">Lot</option>
        </select>
        <button type="submit">Find</button>
        <span class="search-separator" aria-hidden="true"></span>
        <div class="layers-menu">
          <button
            type="button"
            id="layers-toggle"
            aria-haspopup="true"
            aria-expanded="false"
          >
            Layers
          </button>
          <div id="layers-panel" class="layers-panel hidden">
            <label>
              <input type="checkbox" id="layer-obstacle" checked />
              Obstacle
            </label>
            <label>
              <input type="checkbox" id="layer-leisure" checked />
              Leisure
            </label>
            <label>
              <input type="checkbox" id="layer-administrative" checked />
              Administrative
            </label>
          </div>
        </div>
      </form>
    </header>

    <main>
      <div id="map"></div>
    </main>

    <footer class="attribution">
      Map data &copy;
      <a
        href="https://www.openstreetmap.org/copyright"
        target="_blank"
        rel="noopener"
        >OpenStreetMap contributors</a
      >
      (ODbL)
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
