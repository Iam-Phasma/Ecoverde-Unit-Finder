<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecoverde Homes Rosario Unit Finder</title>
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="dns-prefetch" href="https://unpkg.com" />
    <link rel="preconnect" href="https://gc.zgo.at" crossorigin />
    <link rel="dns-prefetch" href="https://gc.zgo.at" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preload" href="css/style.css?v=20261010-route-pause-3" as="style" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="css/style.css?v=20261010-route-pause-3" />
    <link rel="modulepreload" href="js/main.js?v=20261010-route-pause-3" />
  </head>
  <body>
    <a href="#search-form" class="skip-to-search">Skip to search controls</a>
    <main>
      <div
        id="map"
        role="region"
        aria-label="Interactive map of Ecoverde Homes Rosario"
      ></div>
      <div
        id="reroute-banner"
        class="reroute-banner hidden"
        role="status"
        aria-live="polite"
      >
        Tap the road segment you want to avoid.
      </div>
      <form id="search-form" class="search" autocomplete="off">
        <select id="block-select" aria-label="Block">
          <option value="">Block</option>
        </select>
        <select id="lot-select" aria-label="Lot" disabled>
          <option value="">Lot</option>
        </select>
        <button type="submit" title="Find selected block or lot">
          <svg
            class="find-toggle-icon"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-width="2"
              d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
            />
          </svg>
          <span class="find-toggle-label">Find</span>
        </button>
        <div class="recent-menu">
          <button
            type="button"
            id="recent-toggle"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="recent-panel"
            aria-label="Recent searches"
            title="Recent searches"
          >
            <svg
              class="recent-toggle-icon"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 6v6l4 2m5-2a9 9 0 1 1-3.04-6.77"
              />
            </svg>
            <span class="recent-toggle-label">Recent</span>
          </button>
          <div
            id="recent-panel"
            class="recent-panel hidden"
            role="region"
            aria-label="Recent searches"
          >
            <div id="recent-list" class="recent-list"></div>
          </div>
        </div>
        <div class="settings-menu">
          <button
            type="button"
            id="settings-toggle"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="settings-panel"
            aria-label="Settings"
            title="Open settings"
          >
            <svg
              class="settings-toggle-icon w-6 h-6 text-gray-800 dark:text-white"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 13v-2a1 1 0 0 0-1-1h-.757l-.707-1.707.535-.536a1 1 0 0 0 0-1.414l-1.414-1.414a1 1 0 0 0-1.414 0l-.536.535L14 4.757V4a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v.757l-1.707.707-.536-.535a1 1 0 0 0-1.414 0L4.929 6.343a1 1 0 0 0 0 1.414l.536.536L4.757 10H4a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h.757l.707 1.707-.535.536a1 1 0 0 0 0 1.414l1.414 1.414a1 1 0 0 0 1.414 0l.536-.535 1.707.707V20a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-.757l1.707-.708.536.536a1 1 0 0 0 1.414 0l1.414-1.414a1 1 0 0 0 0-1.414l-.535-.536.707-1.707H20a1 1 0 0 0 1-1Z"
              />
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
              />
            </svg>
            <span class="settings-toggle-label">Settings</span>
          </button>
          <div id="settings-panel" class="settings-panel hidden">
            <div class="settings-section settings-section-layers">
              <h2 class="settings-title">Layers</h2>
              <label>
                <input type="checkbox" id="layer-amenities" checked />
                Amenities
              </label>
              <label>
                <input type="checkbox" id="layer-administrative" />
                Buildings
              </label>
              <label id="layer-decoration-option">
                <input type="checkbox" id="layer-decoration" checked />
                Decorations
              </label>
              <label>
                <input type="checkbox" id="layer-obstacle" />
                Obstacles
              </label>
              <label>
                <input type="checkbox" id="layer-road-names" checked />
                Street names
              </label>
            </div>
            <div class="settings-section settings-section-ui">
              <h2 class="settings-title">UI size</h2>
              <label class="ui-size-select-wrap">
                <select id="ui-size-select" class="ui-size-select" aria-label="UI size">
                  <option value="default">Default</option>
                  <option value="x2">2x</option>
                  <option value="x4">4x</option>
                  <option value="x6">6x</option>
                </select>
              </label>
            </div>
          </div>
        </div>
      </form>
      <div
        id="lyket-button"
        class="lyket-button"
        aria-label="Like this map"
        data-tooltip="Thank's for liking"
        data-lyket-type="like"
        data-lyket-id="map-like"
        data-lyket-namespace="ecoverde-unit-finder"
        data-lyket-color-primary="#c23d56"
        data-lyket-color-background="transparent"
        data-lyket-color-icon="#6a5d4b"
        data-lyket-show-counter-from="999999"
      ></div>

      <aside
        id="route-panel"
        class="route-panel hidden"
        aria-live="polite"
        role="region"
        aria-labelledby="route-unit"
      >
        <div class="route-panel-section route-panel-head">
          <div id="route-unit" class="route-unit">Block -, Lot -</div>
          <div id="route-meta" class="route-meta">
            ETA from the gate · -- km
          </div>
        </div>
        <div
          id="route-eta-rows"
          class="route-panel-section route-eta-rows"
        ></div>
        <div class="route-panel-section route-narrative-wrap">
          <div id="route-narrative" class="route-narrative"></div>
          <button
            type="button"
            id="route-share"
            class="route-share"
            title="Copy a link to this route"
          >
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15.141 6 5.518 4.95a1.05 1.05 0 0 1 0 1.549l-5.612 5.088m-6.154-3.214v1.615a.95.95 0 0 0 1.525.845l5.108-4.251a1.1 1.1 0 0 0 0-1.646l-5.108-4.251a.95.95 0 0 0-1.525.846v1.7c-3.312 0-6 2.979-6 6.654v1.329a.7.7 0 0 0 1.344.353 5.174 5.174 0 0 1 4.652-3.191l.004-.003Z"/>
            </svg>
            <span>Share</span>
          </button>
        </div>
        <div class="route-panel-section route-actions">
          <button
            type="button"
            id="route-clear"
            class="eta-clear"
            aria-label="End route"
            title="End route and clear selection"
          >
            End Route
          </button>
          <button
            type="button"
            id="route-reroute"
            class="eta-reroute"
            aria-label="Re-route"
            title="Pick a road point to avoid and recalculate route"
          >
            Re-route
          </button>
          <button
            type="button"
            id="route-dismiss"
            class="eta-dismiss"
            aria-label="Hide Card"
            title="Hide route card"
          >
            Hide Card
          </button>
        </div>
      </aside>
      <div
        id="welcome"
        class="welcome hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="welcome-title"
      >
        <form id="welcome-form" class="welcome-card" autocomplete="off">
          <div class="welcome-brand">
            <img src="assets/eco-logo.svg" alt="" loading="lazy" decoding="async" />
            <div>
              <h1 id="welcome-title">Ecoverde Homes</h1>
              <span class="welcome-location">ROSARIO</span>
            </div>
          </div>
          <p>
            Enter the block and lot number to locate a home and get directions.
          </p>
          <div class="welcome-fields">
            <label>
              <span>Block</span>
              <select id="welcome-block" aria-label="Block">
                <option value="">Block</option>
              </select>
            </label>
            <label>
              <span>Lot</span>
              <select id="welcome-lot" aria-label="Lot" disabled>
                <option value="">Lot</option>
              </select>
            </label>
          </div>
          <button type="submit" id="welcome-find" class="welcome-find" disabled>
            <span>Find</span>
            <svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="26"
              height="26"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                d="M4 12h15m-6-6 6 6-6 6"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
              />
            </svg>
          </button>
          <button type="button" id="welcome-skip" class="welcome-skip">
            Explore the map instead
          </button>
        </form>
      </div>
    </main>

    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script defer src="https://unpkg.com/@lyket/widget@latest/dist/lyket.js?apiKey=pt_697795132193026632019e5e22420e"></script>
    <script type="module" src="js/main.js?v=20261010-route-pause-3"></script>
    <script data-goatcounter="https://terralyft.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js">
      </script>
  </body>
</html>
